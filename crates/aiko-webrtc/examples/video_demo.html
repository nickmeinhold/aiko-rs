<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aiko WebRTC Video Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 24px; }
    h1 { margin-bottom: 16px; }
    .videos { display: flex; gap: 16px; flex-wrap: wrap; }
    .panel { background: #16213e; border-radius: 8px; padding: 12px; }
    .panel h3 { margin-bottom: 8px; font-size: 14px; color: #aaa; }
    video { background: #000; border-radius: 4px; display: block; }
    #status { margin-top: 16px; padding: 8px 12px; background: #0f3460; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Aiko WebRTC Video Demo</h1>
  <div class="videos">
    <div class="panel">
      <h3>Local (Camera)</h3>
      <video id="local" autoplay muted playsinline width="640" height="480"></video>
    </div>
    <div class="panel">
      <h3>Remote (Rust SMPTE Bars)</h3>
      <video id="remote" autoplay playsinline width="640" height="480"></video>
    </div>
  </div>
  <div id="status">Initialising...</div>

  <script>
    const WS_URL = "ws://localhost:9001";

    async function start() {
      const status = document.getElementById("status");
      const localVideo = document.getElementById("local");
      const remoteVideo = document.getElementById("remote");

      // Acquire camera
      let localStream;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        localVideo.srcObject = localStream;
        status.textContent = "Camera acquired, connecting to signaling server...";
      } catch (err) {
        status.textContent = "Camera not available: " + err.message;
        // Continue without camera — we can still receive the remote stream
        localStream = null;
      }

      // Create RTCPeerConnection
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      // Add local camera tracks (if available)
      if (localStream) {
        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }
      }

      // Display remote tracks
      pc.ontrack = (event) => {
        console.log("Remote track:", event.track.kind, event.track.id);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          // Fallback: create a MediaStream from the track
          let existing = remoteVideo.srcObject;
          if (!existing) {
            existing = new MediaStream();
            remoteVideo.srcObject = existing;
          }
          existing.addTrack(event.track);
        }
      };

      // Log connection state
      pc.onconnectionstatechange = () => {
        status.textContent = "Connection: " + pc.connectionState;
      };

      // Connect to signaling server
      const ws = new WebSocket(WS_URL);

      // Forward local ICE candidates
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({
            type: "ice_candidate",
            candidate: event.candidate.candidate,
            sdp_mid: event.candidate.sdpMid,
            sdp_mline_index: event.candidate.sdpMLineIndex,
          }));
        }
      };

      ws.onopen = () => {
        status.textContent = "Signaling connected, waiting for Rust peer offer...";
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        console.log("Signaling:", msg.type);

        if (msg.type === "offer") {
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
          status.textContent = "Sent answer, establishing connection...";
        } else if (msg.type === "ice_candidate") {
          try {
            await pc.addIceCandidate({
              candidate: msg.candidate,
              sdpMid: msg.sdp_mid,
              sdpMLineIndex: msg.sdp_mline_index,
            });
          } catch (err) {
            console.warn("Failed to add ICE candidate:", err);
          }
        }
      };

      ws.onerror = (err) => {
        status.textContent = "WebSocket error — is the signaling server running?";
        console.error("WebSocket error:", err);
      };

      ws.onclose = () => {
        console.log("Signaling WebSocket closed");
      };
    }

    start().catch((err) => {
      document.getElementById("status").textContent = "Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
