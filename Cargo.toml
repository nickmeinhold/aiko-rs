[workspace]
members = [
    "crates/aiko-core",
    "crates/aiko-actor",
    "crates/aiko-pipeline",
    "crates/aiko-mqtt",
    "crates/aiko-webrtc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Nick"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }

# Actor/messaging
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# MQTT
rumqttc = "0.24"

# WebRTC
webrtc = "0.14"
tokio-tungstenite = "0.24"

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
bytes = "1.5"
dashmap = "5.5"
parking_lot = "0.12"

# Internal crates
aiko-core = { path = "crates/aiko-core" }
aiko-actor = { path = "crates/aiko-actor" }
aiko-pipeline = { path = "crates/aiko-pipeline" }
aiko-mqtt = { path = "crates/aiko-mqtt" }
aiko-webrtc = { path = "crates/aiko-webrtc" }
